name: crud_de_games_educacional
description: Mini projeto CRUD de controle de jogos em Flutter com SQLite local.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.1.3
  sqlite3: 3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
